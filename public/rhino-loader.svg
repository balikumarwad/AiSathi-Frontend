<style>
@media (prefers-reduced-motion: no-preference) {
  .rhino { animation: gallop .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
  .ground { animation: scroll .45s linear infinite; }
  .s1 { animation: whoosh .5s ease-in-out infinite; }
  .s2 { animation: whoosh .5s ease-in-out -.2s infinite; }
  .d1 { animation: puff .5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .d2 { animation: puff .5s ease-out -.25s infinite; transform-box: fill-box; transform-origin: center; }
}
@keyframes gallop { 0%,100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-26px) rotate(-2.2deg); } 60% { transform: translateY(0) rotate(1.6deg); } }
@keyframes scroll { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -170; } }
@keyframes whoosh { 0% { transform: translateX(0); opacity: .8; } 100% { transform: translateX(-70px); opacity: 0; } }
@keyframes puff { 0% { transform: scale(.4); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
</style>
